services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    shm_size: "256mb"
    volumes:
      - ./frigate/config:/config
      - ./frigate/storage:/media/frigate
      - ./frigate/media/demo:/demo:ro
      - type: tmpfs
        target: /tmp/cache
        tmpfs: {size: 1000000000}
    ports:
      - "127.0.0.1:5000:5000"   # внутренний API/UI без авторизации — только localhost
      - "127.0.0.1:8971:8971"   # UI с авторизацией
      - "127.0.0.1:8554:8554"   # RTSP-рестрим go2rtc → store-vision
      - "127.0.0.1:1984:1984"   # веб-интерфейс go2rtc
    environment:
      FRIGATE_RTSP_PASSWORD: "${FRIGATE_RTSP_PASSWORD:-change-me}"
